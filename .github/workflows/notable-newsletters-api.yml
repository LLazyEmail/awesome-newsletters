name: Update notable-newsletters API

on:
  push:
    branches:
      - main
    paths:
      - 'website/docs/notable-newsletters/**'
      - 'website/scripts/generate-notable-newsletters.mjs'
      - '.github/workflows/notable-newsletters-api.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: notable-newsletters-api
  cancel-in-progress: false

jobs:
  notable-api:
    name: Regenerate notable-newsletters.json
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Generate notable-newsletters JSON
        run: node ./scripts/generate-notable-newsletters.mjs

      - name: Commit and push JSON
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/static/api/v1/notable-newsletters.json
          if git diff --staged --quiet; then
            echo "notable-newsletters.json already up to date."
            exit 0
          fi
          git commit -m "chore(api): regenerate notable-newsletters JSON"
          git push origin HEAD:main
