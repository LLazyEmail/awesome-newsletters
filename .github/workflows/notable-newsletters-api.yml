name: Update notable-newsletters API

on:
  push:
    branches:
      - main
    paths:
      - 'website/docs/notable-newsletters/**'
      - 'website/scripts/generate-notable-newsletters.mjs'
      - '.github/workflows/notable-newsletters-api.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  notable-api:
    uses: LLazyEmail/documentation-actions/.github/workflows/reusable-catalog-api.yml@v1
    with:
      working-directory: website
      node-version: '20'
      generate-command: node ./scripts/generate-notable-newsletters.mjs
      commit-paths: website/static/api/v1/notable-newsletters.json
      commit-message: 'chore(api): regenerate notable-newsletters JSON'
      install: false
      concurrency-group: notable-newsletters-api
    secrets: inherit
