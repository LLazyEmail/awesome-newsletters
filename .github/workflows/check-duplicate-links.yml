name: Check duplicate links

on:
  pull_request:
    paths:
      - 'README.md'
      - 'scripts/check-duplicate-links.mjs'
      - '.github/workflows/check-duplicate-links.yml'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'scripts/check-duplicate-links.mjs'

jobs:
  duplicates:
    uses: LLazyEmail/documentation-actions/.github/workflows/reusable-awesome-list-checks.yml@v1
    with:
      checks: duplicate-links
      duplicate-mode: warn
      node-version: '20'
