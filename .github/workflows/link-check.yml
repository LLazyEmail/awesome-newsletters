name: Link check

on:
  pull_request:
    paths:
      - 'README.md'
      - 'notes/**'
      - '.github/workflows/link-check.yml'
      - '.lychee.toml'
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  lychee:
    uses: LLazyEmail/documentation-actions/.github/workflows/reusable-link-check.yml@main
    with:
      args: >-
        --verbose
        --no-progress
        --max-concurrency 8
        --accept 200,204,206,403,429
        --timeout 20
        README.md notes/**
      create-issue: false
    secrets: inherit
