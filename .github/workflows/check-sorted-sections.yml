name: Check sorted sections

on:
  pull_request:
    paths:
      - 'README.md'
      - 'scripts/check-sorted-sections.mjs'
      - '.github/workflows/check-sorted-sections.yml'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'scripts/check-sorted-sections.mjs'

jobs:
  sorted:
    uses: LLazyEmail/documentation-actions/.github/workflows/reusable-awesome-list-checks.yml@v1
    with:
      checks: sorted-sections
      sorted-mode: warn
      node-version: '20'
