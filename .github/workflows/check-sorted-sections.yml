name: Check sorted sections

on:
  pull_request:
    paths:
      - 'README.md'
      - 'scripts/check-sorted-sections.mjs'
      - '.github/workflows/check-sorted-sections.yml'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'scripts/check-sorted-sections.mjs'

jobs:
  sorted:
    name: sorted-sections
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check section sort order (warn-only)
        run: node scripts/check-sorted-sections.mjs
