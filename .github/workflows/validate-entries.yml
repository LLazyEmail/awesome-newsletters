name: Validate README entries

on:
  pull_request:
    paths:
      - 'README.md'
      - 'scripts/validate-entry-format.mjs'
      - '.github/workflows/validate-entries.yml'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'scripts/validate-entry-format.mjs'

jobs:
  entry-format:
    uses: LLazyEmail/documentation-actions/.github/workflows/reusable-awesome-list-checks.yml@v1
    with:
      checks: entry-format
      entry-format-mode: fail
      node-version: '20'
