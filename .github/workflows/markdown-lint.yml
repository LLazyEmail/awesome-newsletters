name: Markdown lint

on:
  pull_request:
    paths:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.markdownlint.json'
      - '.github/workflows/markdown-lint.yml'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.markdownlint.json'

jobs:
  markdownlint:
    uses: LLazyEmail/documentation-actions/.github/workflows/reusable-markdownlint.yml@main
    with:
      globs: |
        README.md
