name: Update catalog API

on:
  push:
    branches:
      - main
    paths:
      - 'README.md'
      - 'website/docs/**'
      - 'website/scripts/generate-catalog.mjs'
      - '.github/workflows/catalog-api.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  catalog-api:
    uses: LLazyEmail/documentation-actions/.github/workflows/reusable-catalog-api.yml@v1
    with:
      working-directory: website
      node-version: '20'
      generate-command: node ./scripts/generate-catalog.mjs
      commit-paths: website/src/data/catalog.json website/static/api/v1/catalog.json
      commit-message: 'chore(api): regenerate newsletter catalog JSON'
      install: false
      concurrency-group: catalog-api
    secrets: inherit
