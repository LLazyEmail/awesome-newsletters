name: Update catalog API

on:
  push:
    branches:
      - main
    paths:
      - 'README.md'
      - 'website/docs/**'
      - 'website/scripts/generate-catalog.mjs'
      - '.github/workflows/catalog-api.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-api
  cancel-in-progress: false

jobs:
  catalog-api:
    name: Regenerate catalog.json
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Generate catalog JSON
        run: node ./scripts/generate-catalog.mjs

      - name: Commit and push JSON
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add website/src/data/catalog.json website/static/api/v1/catalog.json

          if git diff --staged --quiet; then
            echo "catalog.json already up to date."
            exit 0
          fi

          git commit -m "chore(api): regenerate newsletter catalog JSON"
          git push origin HEAD:main
