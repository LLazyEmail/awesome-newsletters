name: Update changelog

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'CHANGELOG.md'
      - 'website/src/data/changelog.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: changelog
  cancel-in-progress: false

jobs:
  changelog:
    name: Regenerate changelog
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate changelog
        run: npm run changelog

      - name: Commit and push changelog
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add CHANGELOG.md website/src/data/changelog.json

          if git diff --staged --quiet; then
            echo "Changelog already up to date."
            exit 0
          fi

          git commit -m "chore(changelog): regenerate after merged pull request"
          # Concurrent main pushes (changelog + catalog + docs-index + notable)
          # race; rebase and retry instead of failing the job.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto origin/main"
            git pull --rebase origin main
            sleep $((attempt * 2))
          done
          echo "push failed after retries" >&2
          exit 1
