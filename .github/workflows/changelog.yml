name: Update changelog

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'CHANGELOG.md'
      - 'website/src/data/changelog.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  changelog:
    uses: LLazyEmail/documentation-actions/.github/workflows/reusable-changelog.yml@v1
    with:
      working-directory: website
      node-version: '20'
      cache-dependency-path: website/package-lock.json
      commit-paths: CHANGELOG.md website/src/data/changelog.json
    secrets: inherit
