name: Test deployment

on:
  pull_request:
    branches:
      - main
    paths:
      - 'website/**'
      - '.github/workflows/**'

jobs:
  test-deploy:
    uses: LLazyEmail/documentation-actions/.github/workflows/reusable-docusaurus-test-deploy.yml@main
    with:
      working-directory: website
      node-version: '20'
      cache-dependency-path: website/package-lock.json
