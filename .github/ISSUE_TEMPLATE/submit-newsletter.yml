name: Submit a newsletter or resource
description: Propose a newsletter, directory, article, or tool for the curated list
title: "add: "
labels: ["addition"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for contributing! Prefer a small PR editing `README.md` when you can.
        Use this form if you want maintainers to review before a PR.
  - type: dropdown
    id: kind
    attributes:
      label: What are you submitting?
      options:
        - Newsletter (publication to read/study)
        - Newsletter directory / roundup
        - Article or guide
        - Tool or platform
        - Template / HTML email resource
        - GitHub repository
        - Other
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Name
      placeholder: e.g. The Hustle
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: URL
      placeholder: https://…
    validations:
      required: true
  - type: dropdown
    id: section
    attributes:
      label: Suggested README section
      options:
        - Newsletter directories & roundups
        - Great articles to read
        - Demand Curve & growth tactics
        - Building a list
        - Monetization
        - Templates & HTML email
        - GitHub repositories
        - Ops, deliverability & Sendy notes
        - Arthur Tkachenko articles
        - New section (describe below)
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why does it belong here?
      description: One or two sentences on usefulness for newsletter creators or readers.
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Suggested one-line description
      placeholder: Short blurb for the README entry
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the README and this is not already listed
          required: true
        - label: The URL loads for me in a normal browser
          required: true
        - label: I am willing to open a follow-up PR if maintainers approve
          required: false
